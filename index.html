/*
  ENVICOOL SERVICE HUB — Corporate UI system
  Core brand: Envicool deep blue / safety orange.
  Editorial hierarchy, concise surfaces, accessible contrast.
*/
:root{
  --navy:#00388b;
  --navy2:#062d72;
  --mint:#0646a2;
  --mint-soft:#ecf3ff;
  --paper:#f5f7fb;
  --card:#ffffff;
  --ink:#172c49;
  --muted:#697a91;
  --line:#e3e9f2;
  --shadow:0 1px 2px rgba(13,36,72,.035);
  --radius:10px;
  --red:#c83c52;
  --red-bg:#fff0f2;
  --amber:#a86a11;
  --amber-bg:#fff6e9;
  --blue:#0646a2;
  --blue-bg:#edf4ff;
  --brand:#063b95;
  --brand-deep:#092c6c;
  --brand-hover:#0c4eac;
  --orange:#ef9514;
  --focus:rgba(19,87,175,.16);
}
html{scroll-behavior:smooth}
html,body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--paper);color:var(--ink);font-size:13px;letter-spacing:-.006em}
button,input,select,textarea{font-family:inherit}
button{transition:background-color .16s ease,border-color .16s ease,color .16s ease,box-shadow .16s ease}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
button:disabled{opacity:.45}
::selection{background:#dce9ff;color:#032d70}
.app{min-height:100vh;background:var(--paper)}
.sidebar{width:250px;background:#fff;color:#51637c;padding:0;border-right:1px solid #dfe6ef;box-shadow:0 0 1px #ddd;z-index:30}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:11px;margin:0;padding:24px 22px 19px;border-bottom:1px solid var(--line);min-height:128px;color:var(--ink)}
.brand-logo-wrap{display:flex;width:164px;height:59px;align-items:center;justify-content:flex-start;overflow:hidden;position:relative;background:#fff}
.brand-logo{display:block;width:160px;max-height:62px;object-fit:contain;object-position:left center;mix-blend-mode:multiply}.brand-logo-official{position:absolute;inset:0;opacity:0;transition:opacity .22s ease;background:white}.brand-logo-official.loaded{opacity:1}
.brand-subline{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:760;letter-spacing:.12em;color:#6d809a}
.brand-subline:before{content:"";width:3px;height:13px;border-radius:1px;background:var(--orange)}
.workspace-label{display:flex;justify-content:space-between;align-items:center;margin:23px 21px 12px;color:#8998ac;font-size:10px;letter-spacing:.13em;font-weight:760;text-transform:uppercase}
.workspace-label span:last-child{color:#a8b4c3;font-weight:600;letter-spacing:0}
.nav-label{padding:0;margin:0}
.nav{padding:0 11px;gap:4px;scrollbar-width:thin;scrollbar-color:#d9e2ef transparent}
.nav button{border-radius:7px;min-height:42px;padding:11px 12px;gap:11px;color:#51637d;font-weight:615;line-height:1.25;font-size:12px}
.nav button:hover{background:#f3f6fb;color:#11356c}
.nav button.active{background:#eaf1fe;color:#073b92;box-shadow:none;font-weight:745}
.nav button.active:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#0748a5;border-radius:2px}
.nav button{position:relative}
.nav button.active svg{stroke-width:2.1}
.nav svg{width:17px;height:17px}
.sidebar-bottom{padding:16px 18px 22px;margin:20px 10px 0;border-top:1px solid var(--line);color:#7d8ca0;line-height:1.55;font-size:10.5px}
.sidebar-bottom .mini{color:#2c4769;font-size:11px;display:flex;align-items:center;gap:7px;margin-bottom:7px}
.sidebar-bottom .mini:before{content:"";background:#1e9b74;width:6px;height:6px;border-radius:50%}

.crumb{font-size:11px;color:#8290a4;letter-spacing:.005em}

.top-actions{gap:11px}
.demo-pill{font-size:10px;padding:6px 10px;border-radius:5px;letter-spacing:.06em;background:#eaf3ed;color:#2d7860}
.icon-button{width:35px;height:35px;border-radius:7px;background:#fff;border:1px solid var(--line);color:#60738e}
.icon-button:hover{background:#f3f6fb;color:var(--brand)}
.role-select{height:38px;border:1px solid #dce4ee;border-radius:7px;padding:5px 9px 5px 12px;gap:12px;box-shadow:0 1px 2px #071f3b03}
.role-select label{color:#8493a7;font-size:9px;white-space:nowrap;letter-spacing:.045em}
.role-select select{font-size:11px;max-width:250px;outline:none;font-weight:690;color:#253c5b;cursor:pointer}
.avatar{width:36px;height:36px;border:1px solid #d8e5f6;box-shadow:none;border-radius:9px;background:#e8f1ff;color:#063a91;font-size:11px}
.content{max-width:1500px;padding:32px 36px 58px}
.banner{margin:0 0 28px;padding:0 0 26px;display:flex;align-items:flex-end;justify-content:space-between;gap:30px;background:transparent;border-radius:0;color:var(--ink);border-bottom:1px solid var(--line);overflow:visible}
.banner:after{display:none}
.eyebrow{display:flex;align-items:center;gap:9px;text-transform:uppercase;color:#57759e;opacity:1;font-size:10px;font-weight:780;letter-spacing:.13em}
.eyebrow:before{content:"";display:inline-block;width:7px;height:7px;background:var(--orange);border-radius:2px}
.banner h1{font-size:clamp(24px,2.15vw,30px);letter-spacing:-.038em;line-height:1.2;margin:11px 0 10px;font-weight:790;color:#15345a}
.banner p{color:#6d7e92;font-size:12px;line-height:1.7;max-width:700px;margin:0}
.banner .btn{position:relative;flex-shrink:0}
.btn{min-height:37px;padding:9px 15px;border-radius:7px;box-shadow:none;font-size:11.5px;font-weight:720;background:var(--brand);letter-spacing:0}
.btn:hover{filter:none;transform:none;background:var(--brand-hover)}
.btn:active{transform:translateY(1px)}
.btn.secondary{background:#eaf0f7;color:#355777}
.btn.secondary:hover{background:#e0e9f4}
.btn.outline{background:#fff;color:#335372;border-color:#dbe3ee}
.btn.outline:hover{border-color:#afc6e3;background:#f9fbff;color:var(--brand)}
.btn.text{color:var(--brand);background:transparent}
.btn.sm{min-height:31px;padding:7px 11px;border-radius:6px;font-size:11px}
.btn.danger{background:#bb4151}
.section-head{margin:29px 0 15px;align-items:center}
.section-head h2{font-size:17px;letter-spacing:-.028em;font-weight:750;color:#233c5b}
.section-head p{font-size:11.5px;line-height:1.6}
.grid{gap:14px}
.stats{grid-template-columns:repeat(4,minmax(0,1fr))}
.stat{background:#fff;box-shadow:var(--shadow);min-height:134px;border-radius:9px;border:1px solid #e0e7f0;padding:20px 20px 16px}
.stat:before{position:absolute;left:0;top:21px;width:3px;height:28px;content:"";background:#0b58b9;border-radius:0 3px 3px 0}
.stat:nth-child(2):before{background:#e38b1a}.stat:nth-child(3):before{background:#238775}.stat:nth-child(4):before{background:#7190bd}
.stat .icon-wrap{width:34px;height:34px;border-radius:7px;background:#edf3fc;color:#1b5198;right:17px;top:17px}
.stat:nth-child(2) .icon-wrap{background:#fff4e7;color:#b77d28}
.stat:nth-child(3) .icon-wrap{background:#eaf6f2;color:#338b77}
.stat .icon-wrap svg{width:16px;height:16px}
.stat .label{font-size:11px;color:#6d7c91;font-weight:650;padding-right:34px}
.stat .num{font-size:31px;margin:15px 0 5px;letter-spacing:-.055em;font-weight:800;color:#15385e}
.stat .detail{font-size:11px;color:#8291a3}
.panel{border:1px solid #e0e7f0;border-radius:9px;box-shadow:var(--shadow);background:#fff}
.panel-head{padding:17px 20px;background:#fff;border-bottom:1px solid #e7ecf3;gap:10px}
.panel-head h3{font-size:12.5px;font-weight:760;color:#253e5d}
.panel-head small{font-size:11px}
.panel-body{padding:13px 20px}
.layout-2{grid-template-columns:minmax(0,1.65fr) minmax(290px,1fr);gap:16px}
.layout-equal{gap:16px}
table{font-size:11.5px}
th{background:#f8fafc;color:#8190a5;font-size:10px;letter-spacing:.075em;font-weight:720;padding:12px 16px}
td{padding:12px 16px;color:#324864;font-size:11.5px;border-bottom:1px solid #edf1f5;line-height:1.5}
tbody tr:hover{background:#f8fbff}
.cell-title{font-weight:720;color:#233e62;font-size:11.5px}
.cell-sub{font-size:10.5px;color:#78899e;margin-top:4px}
.chip{font-size:10px;padding:5px 8px;border-radius:5px;font-weight:720;border:1px solid transparent}
.chip.red{color:#b43b50;background:#fff0f1;border-color:#ffe1e4}
.chip.amber{color:#a16a1c;background:#fff6e9;border-color:#fce9cb}
.chip.blue{color:#1254a7;background:#eaf2ff;border-color:#dceafa}
.chip.green{color:#167758;background:#eaf7f0;border-color:#d9eee5}
.chip.gray{color:#637891;background:#f1f4f7;border-color:#e7ecf2}
.chip.purple{color:#6b58a4;background:#f2f0fa;border-color:#e9e6f7}
.link-btn{color:#0a4d9e;font-size:11px;font-weight:720;text-decoration:none}
.link-btn:hover{color:#003378;text-decoration:underline}
.mini-row{padding:13px 0;border-color:#edf1f5}
.mini-row strong{font-size:11.5px;color:#2b4160}
.mini-row small{font-size:10.5px}
.severity.high{background:#cb4d5f}.severity.medium{background:#dda038}.severity.low{background:#207f74}
.progress{background:#e9eff7;border-radius:4px;height:7px}
.progress span{background:#2e6db8;border-radius:4px}
.field{gap:7px}
.field label{color:#3a5476;font-size:11px;font-weight:740}
.field input,.field select,.field textarea,.toolbar input,.toolbar select{border:1px solid #d9e2ee;border-radius:6px;padding:10px 11px;font-size:12px;min-height:39px;background:#fff;color:#223d60}
.field input:focus,.field select:focus,.field textarea:focus,.toolbar input:focus,.toolbar select:focus{border-color:#7ca2d7;box-shadow:0 0 0 3px rgba(32,98,193,.10)}
.field textarea{min-height:104px}
.toolbar{gap:9px}
.toolbar input{max-width:310px}
.toolbar select{max-width:210px}
.notice{border-radius:7px;border-color:#cfdfed;background:#f0f6ff;color:#345b8a;font-size:11.5px;line-height:1.7}
.notice.blue{border-color:#d5e3f6;color:#385e8d;background:#f1f6fe}
.notice.amber{border-color:#f3dfc0;color:#90621b;background:#fffaef}
.notice.danger{border-color:#f5d2da;color:#a34251;background:#fff5f7}
.tagline{border:1px solid var(--line);background:#fff;color:#708199;border-radius:7px}
.asset-grid{gap:14px}
.asset-card{padding:18px;border:1px solid #e0e7f0;box-shadow:var(--shadow);border-radius:9px}
.asset-icon{width:40px;height:40px;border-radius:8px;background:#edf3fe;color:#194f9c;margin-bottom:17px}
.asset-icon svg{width:21px;height:21px}
.asset-title{font-size:15px;color:#1f416d;letter-spacing:-.02em}
.asset-meta{margin:17px 0 14px}
.asset-meta span{font-size:10px}
.asset-meta strong{font-size:11.5px;color:#304c6d}
.asset-foot{border-color:#e9edf4}
.tabs{border-color:var(--line)}
.tabs button{font-size:11px;color:#708199;padding:10px 13px}
.tabs button.active{border-color:var(--brand);color:var(--brand)}
.timeline .time-dot{background:#416eb2;border-color:#dfeaff}
.timeline li:not(:last-child) .time-dot:after{background:#dae5f5}
.kb-list{gap:15px}
.kb-card{border:1px solid #e0e7f0;border-radius:9px;padding:18px;box-shadow:var(--shadow)}
.kb-card h3{font-size:14px;color:#244467}
.kb-card p{color:#6d7f93}
.segmented{background:#edf1f7;border-radius:7px}
.segmented button{border-radius:5px}
.segmented button.active{color:#0b4d9f}
.modal-backdrop{background:rgba(12,30,54,.52);backdrop-filter:blur(1px)}

.modal-header{padding:21px 24px}
.modal-header h2{font-size:17px;color:#183d69}
.modal-content{padding:22px 24px}
.form-grid{gap:15px}
.detail-box{border-radius:7px;border:1px solid #e1e8f2;background:#f9fbfe}
.detail-box small{font-size:10.5px}
.detail-box strong{color:#233e62}
.signature-wrap{border:1px dashed #a5bbd8;background:#f6f9ff;border-radius:7px}
.signature-wrap canvas{border-radius:5px}
.report-section{background:#f8fafc;border:1px solid #e4eaf2;border-radius:7px}
.toast{background:#133967;border-radius:8px;box-shadow:0 13px 35px rgba(10,37,83,.2);font-size:11.5px}
.demo-pill{border:1px solid #d9eae0}
.page-note{font-size:11.5px}
.danger-zone{margin-top:30px;border:1px solid #e0e7f0;border-left:3px solid #f0a536;border-radius:7px;padding:17px 20px;background:#fff;box-shadow:var(--shadow)}
.kpi-breakdown div{border-radius:7px;background:#f9fbfd}
.kpi-breakdown b{font-size:22px;color:#24486f}
.muted-dot{background:#3489b7}
.step{padding:17px 17px 15px;border-radius:9px;border-color:#e0e8f1;box-shadow:var(--shadow)}
.step b{font-size:12px;color:#164e97;font-weight:760;border-radius:5px;padding:5px 7px;background:#eaf2fe;display:inline-block}
.step strong{font-size:11.5px;color:#223f62;margin-top:12px}
.step small{font-size:10.5px;color:#75869a}
.help-item{border-radius:7px;background:#fff;border-color:#e4eaf2}
.form-actions{margin-top:20px}
.side-footer-links{display:flex;justify-content:space-between;gap:5px;margin-top:12px}
.side-footer-links button{border:0;background:transparent;color:#2d5e9a;font-size:10.5px;padding:0;text-decoration:underline;text-underline-offset:2px}
.app-footer{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);font-size:10.5px;color:#97a3b3;display:flex;justify-content:space-between;gap:14px;align-items:center}
.role-caption{display:inline-flex;align-items:center;gap:6px;color:#8090a4;font-size:10px;font-weight:600}
.role-caption:before{content:"";background:var(--orange);width:5px;height:5px;border-radius:50%}
.toolbar-tip{font-size:11px;color:#8a99ab;margin-left:auto}
@media(max-width:1230px){
  .topbar{padding:0 22px}.content{padding:25px 24px 50px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .layout-2{grid-template-columns:1fr}
  .asset-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .callout-steps{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:840px){
  .sidebar{width:265px;transform:translateX(-100%);box-shadow:14px 0 45px #172c4920}

  .mobile-toggle{display:inline-flex}

  .banner{padding-bottom:21px;margin-bottom:21px;gap:18px}

  .modal-backdrop{padding:9px}
  .help-list{grid-template-columns:1fr}
  .desktop-only{display:none!important}
  .mobile-only{display:inline-flex}
  .avatar{display:none}
}
@media(max-width:600px){

  .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

  .stat .icon-wrap{display:none}

  .section-head p{font-size:11px}

  .table-scroll{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}

  td{padding:11px 12px}th{padding:11px 12px}
  .callout-steps{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .step{padding:12px}
  .step strong{font-size:11px}
  .step small{font-size:10px}
  .kpi-breakdown{grid-template-columns:1fr 1fr}
  .toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .toolbar input,.toolbar select{width:100%;max-width:none;grid-column:span 2}

  .danger-zone{flex-direction:column;align-items:flex-start;gap:12px}
  .app-footer{flex-direction:column;align-items:flex-start}
  .two-cols{grid-template-columns:1fr}
}
@media(max-width:360px){
  .role-select select{max-width:110px}
  .topbar{padding:0 11px}
  .top-title{font-size:12px}
  .callout-steps{grid-template-columns:1fr}
}
@media print{
  .sidebar,.topbar,.app-footer,.btn,.modal-backdrop,.toast-wrap,.danger-zone{display:none!important}
  .main{margin:0}.content{max-width:none;padding:0}
  .banner{background:#fff;border-bottom:1px solid #d9e3ef;color:#182f51}
  .panel,.stat{break-inside:avoid}
}

function renderPM(){const pms=role==='tech'?data.pms.filter(p=>p.tech==='Arya Pratama'):data.pms;return banner('Preventive Maintenance','Pengelolaan jadwal dan checklist PM dengan interval yang dapat ditentukan per kontrak.',role==='manager'?'new-pm':'','Buat Jadwal PM')+`<div class="notice blue">Interval PM pada prototipe adalah <b>data konfigurasi per site</b>, bukan klaim jadwal resmi perusahaan. Hasil pengukuran ≥75% akan diberi peringatan usulan penggantian filter.</div>${title('Jadwal pemeriksaan','Manajer membuat jadwal, teknisi mencatat hasil pemeriksaan.') }<section class="panel table-scroll"><table><thead><tr><th>ID</th><th>Aset</th><th>Jadwal</th><th>Teknisi</th><th>Status</th><th></th></tr></thead><tbody>${pms.map(p=>`<tr><td><b>${p.id}</b></td><td><b>${esc(asset(p.asset).name)}</b><span class="cell-sub">${esc(site(p.site).name)}</span></td><td>${fmt(p.due)}</td><td>${esc(p.tech)}</td><td>${chip(p.status)}</td><td>${role==='tech'&&p.status!=='Selesai'?`<button class="link-btn" data-action="record-pm" data-id="${p.id}">Isi checklist</button>`:`<button class="link-btn" data-action="view-pm" data-id="${p.id}">Lihat detail</button>`}</td></tr>`).join('')}</tbody></table></section>`}
function renderKnowledge(){let all=data.kb.filter(k=>(role==='manager'||role==='hq'||k.status==='Terbit')&&(!ui.kbSearch||Object.values(k.title).join(' ').toLowerCase().includes(ui.kbSearch.toLowerCase())||k.code.toLowerCase().includes(ui.kbSearch.toLowerCase()))&&(ui.kbType==='Semua'||k.type===ui.kbType));return banner('Basis Pengetahuan Teknis','Artikel troubleshooting yang ditautkan ke model peralatan dan kode alarm.',role==='manager'?'new-kb':'','Buat Artikel')+`<div class="toolbar"><input id="kbSearch" placeholder="Cari masalah atau kode alarm..." value="${esc(ui.kbSearch)}"><select id="kbType"><option>Semua</option>${CATEGORIES.map(x=>`<option ${ui.kbType===x?'selected':''}>${esc(x)}</option>`).join('')}</select><button class="btn sm outline" data-action="filter-kb">${ic('search')}Cari</button><div style="margin-left:auto" class="segmented">${['id','en','zh'].map(x=>`<button class="${ui.lang===x?'active':''}" data-action="lang" data-lang="${x}">${x.toUpperCase()}</button>`).join('')}</div></div><section class="kb-list">${all.map(k=>`<article class="kb-card"><div style="display:flex;justify-content:space-between;align-items:center">${chip(k.type,'blue')}${chip(k.status)}</div><h3>${esc(k.title[ui.lang]||k.title.id)}</h3><p>${esc(k.body[ui.lang]||k.body.id)}</p><footer><span class="kb-meta">${esc(k.code)} · ${ui.lang.toUpperCase()}</span>${role==='manager'&&k.status==='Draft'?`<button class="link-btn" data-action="approve-kb" data-id="${k.id}">Setujui & terbitkan</button>`:`<span class="muted tiny">${k.status==='Draft'?'Menunggu persetujuan':'Panduan umum (demo)'}</span>`}</footer></article>`).join('')||'<div class="empty panel"><strong>Artikel tidak ditemukan</strong>Ubah filter atau kata kunci pencarian.</div>'}</section><p class="page-note">Artikel ini berisi teks demonstrasi, bukan instruksi servis resmi Envicool. Selalu ikuti SOP dan standar keselamatan site asli.</p>`}
function renderParts(){return banner('Manajemen Suku Cadang',role==='tech'?'Ajukan kebutuhan komponen dari tiket servis yang sedang ditangani.':'Lacak permintaan, pengiriman pusat, dan estimasi kedatangan komponen.',role==='tech'?'new-part':'','Ajukan Komponen')+`<section class="panel table-scroll"><table><thead><tr><th>Permintaan</th><th>Komponen</th><th>Tiket terkait</th><th>Estimasi tiba</th><th>Status</th><th></th></tr></thead><tbody>${data.parts.filter(x=>role!=='tech'||ticket(x.ticket)?.assigned==='Arya Pratama').map(x=>`<tr><td><b>${esc(x.id)}</b><span class="cell-sub">${fmt(x.requested)}</span></td><td><b>${esc(x.name)}</b><span class="cell-sub">Jumlah ${esc(x.qty)}</span></td><td>${esc(x.ticket)}</td><td>${fmt(x.eta)}</td><td>${chip(x.status)}</td><td>${role==='manager'?`<button class="link-btn" data-action="update-part" data-id="${x.id}">Perbarui</button>`:`<button class="link-btn" data-action="ticket" data-id="${x.ticket}">Lihat tiket</button>`}</td></tr>`).join('')}</tbody></table></section><p class="page-note">Status pengiriman dan ETA pada halaman ini hanya simulasi. Persediaan fisik dan pengiriman nyata tidak terhubung.</p>`}
function renderHQ(){const es=role==='tech'?data.escalations.filter(e=>ticket(e.ticket)?.assigned==='Arya Pratama'):data.escalations;return banner(role==='hq'?'Eskalasi Teknis dari Indonesia':'Eskalasi ke Kantor Pusat','Pertanyaan teknis, bukti pendukung, dan rekomendasi pusat dicatat dalam riwayat tiket.',role==='tech'?'new-escalation':'','Buat Eskalasi')+`<div class="grid">${es.map(e=>`<section class="panel"><div class="panel-body"><div style="display:flex;justify-content:space-between;gap:12px"><div><b>${esc(e.id)}</b> <span class="muted tiny">· ${esc(e.ticket)}</span></div>${chip(e.state)}</div><p class="compact small">${esc(e.question)}</p><div class="notice ${e.response?'':'amber'}">${e.response?`<b>Tanggapan Tim Pusat:</b><br>${esc(e.response)}`:'Menunggu rekomendasi tim teknis HQ. Tiket tetap tercatat sebagai kasus eskalasi.'}</div>${role==='hq'&&e.state!=='Dijawab'?`<div class="form-actions"><button class="btn sm" data-action="reply-hq" data-id="${e.id}">Tulis Tanggapan</button></div>`:''}</div></section>`).join('')||`<section class="panel empty"><strong>Tidak ada eskalasi</strong>Kasus eskalasi akan muncul setelah dikirimkan oleh teknisi.</section>`}</div>`}
function renderDashboard(){const all=data.tickets,closed=all.filter(t=>t.status==='Selesai'),active=all.filter(t=>t.status!=='Selesai');const rated=closed.filter(t=>t.rating);const avg=rated.length?(rated.reduce((s,t)=>s+Number(t.rating),0)/rated.length).toFixed(1):'—';const overdue=active.filter(t=>t.priority==='P1'&&Date.now()-new Date(t.created).getTime()>site(t.site).responseSla*60000).length;const freq=data.sites.map(s=>({name:s.name,n:all.filter(t=>t.site===s.id).length}));const max=Math.max(...freq.map(x=>x.n),1);return banner('Dashboard SLA & Kinerja','Indikator operasional yang dihitung dari data demo; bukan angka capaian riil perusahaan.')+`<section class="grid stats">${stat('Total tiket',all.length,'Seluruh tiket demo','ticket')}${stat('Tiket selesai',closed.length,`${all.length?(closed.length/all.length*100).toFixed(0):0}% dari data contoh`,'check')}${stat('P1 berisiko SLA',overdue,'Indikator berdasarkan waktu pembuatan demo','clock')}${stat('Rata-rata rating',avg,rated.length+' survei tersimpan','star')}</section>${title('Analitik layanan','Pengukuran dan visualisasi akan terisi dari aktivitas yang dibuat selama demo.') }<section class="layout-equal"><div class="panel"><div class="panel-head"><h3>Jumlah tiket per site</h3></div><div class="panel-body">${freq.map(x=>`<div class="chart-row"><label title="${esc(x.name)}">${esc(x.name)}</label><div class="progress"><span style="width:${x.n/max*100}%"></span></div><b>${x.n}</b></div>`).join('')}</div></div><div class="panel"><div class="panel-head"><h3>Distribusi status</h3></div><div class="panel-body"><div class="kpi-breakdown">${[['Baru',all.filter(t=>t.status==='Baru').length],['Sedang ditangani',all.filter(t=>['Ditugaskan','Dikerjakan'].includes(t.status)).length],['Menunggu',all.filter(t=>t.status.startsWith('Menunggu')).length],['Selesai',closed.length]].map(([n,v])=>`<div>${chip(n,n==='Selesai'?'green':'blue')}<b>${v}</b><small>Tiket</small></div>`).join('')}</div></div></div></section>${title('Definisi pengukuran','Status yang belum mempunyai data aktual ditampilkan sebagai belum tersedia.') }<section class="panel table-scroll"><table><thead><tr><th>Indikator</th><th>Pengukuran pada prototipe</th><th>Catatan</th></tr></thead><tbody><tr><td><b>Waktu respons awal</b></td><td>Waktu tiket dibuat → penugasan pertama</td><td>Belum mewakili respons pelanggan sesungguhnya</td></tr><tr><td><b>Waktu kedatangan</b></td><td>Target ETA yang diinput manajer</td><td>Waktu kedatangan aktual belum direkam</td></tr><tr><td><b>Waktu penyelesaian</b></td><td>Waktu tiket dibuat → konfirmasi selesai</td><td>Hanya untuk tiket selesai</td></tr><tr><td><b>First-time fix rate</b></td><td>—</td><td>Jumlah kunjungan per tiket belum dimodelkan</td></tr><tr><td><b>Kepatuhan PM</b></td><td>${data.pms.filter(p=>p.status==='Selesai').length}/${data.pms.length} jadwal selesai</td><td>Rekap demo, tidak menggambarkan periode tertentu</td></tr><tr><td><b>Customer feedback</b></td><td>${rated.length} penilaian</td><td>Skor PIC setelah konfirmasi</td></tr></tbody></table></section>`}
function renderWarranty(){const lim=Number(ui.warrantyDays);let items=data.assets.filter(a=>daysLeft(a.warranty)<=lim).sort((a,b)=>new Date(a.warranty)-new Date(b.warranty));return banner('Garansi & Peluang Layanan','Informasi aset yang mendekati akhir masa garansi untuk tindak lanjut tim sales.')+`<div class="toolbar"><div class="field" style="min-width:230px"><label for="warrantySelect">Periode peringatan</label><select id="warrantySelect">${[30,90,180,365].map(x=>`<option value="${x}" ${lim===x?'selected':''}>Dalam ${x} hari</option>`).join('')}</select></div></div><section class="panel table-scroll"><table><thead><tr><th>Aset & site</th><th>Nomor seri</th><th>Akhir garansi</th><th>Sisa hari</th><th>Tindak lanjut</th></tr></thead><tbody>${items.map(a=>{const done=data.followups.some(f=>f.asset===a.id);return `<tr><td><b>${esc(a.name)}</b><span class="cell-sub">${esc(site(a.site).name)}</span></td><td>${esc(a.serial)}</td><td>${fmt(a.warranty)}</td><td>${chip(daysLeft(a.warranty)+' hari',daysLeft(a.warranty)<=30?'red':'amber')}</td><td>${done?chip('Sudah ditindaklanjuti','green'):`<button class="link-btn" data-action="followup" data-id="${a.id}">Tandai follow-up</button>`}</td></tr>`}).join('')||'<tr><td colspan="5" class="empty">Tidak ada aset dalam rentang peringatan ini.</td></tr>'}</tbody></table></section>`}
function showTicketForm(){const list=role==='pic'?data.assets.filter(a=>a.site==='SITE-01'):data.assets;modal('Mengajukan Permintaan Layanan',`<form data-form="new-ticket" class="form-grid"><div class="field"><label>Site pelanggan *</label><select name="site" id="newTicketSite" required ${role==='pic'?'disabled':''}>${data.sites.map(s=>`<option value="${s.id}" ${s.id==='SITE-01'?'selected':''}>${esc(s.name)}</option>`).join('')}</select>${role==='pic'?'<input type="hidden" name="site" value="SITE-01">':''}</div><div class="field"><label>Unit terkait *</label><select id="newTicketAsset" name="asset" required>${itemOptions(list,a=>a.name+' · '+a.serial,'Pilih unit') }<option value="manual">Unit lain / nomor seri manual</option></select></div><div class="field full"><button type="button" class="btn sm secondary" data-action="qr-demo" style="align-self:flex-start">${ic('search')}Simulasikan Scan QR Unit</button><div class="hint">Memilih aset pertama sebagai simulasi pembacaan QR; tidak menggunakan kamera.</div></div><div class="field full"><label>Nomor seri manual (jika unit belum terdaftar)</label><input name="manualSerial" id="manualSerial" placeholder="Contoh: ENV-CR-XXXXX"></div><div class="field"><label>Kategori gangguan *</label><select name="category" required><option>Gangguan teknis</option><option>Alarm unit</option><option>Kinerja menurun</option><option>Lainnya</option></select></div><div class="field"><label>Dampak terhadap operasional *</label><select name="impact"><option>Unit mati / risiko uptime</option><option selected>Performa menurun</option><option>Alarm tanpa gangguan kritis</option><option>Informasi / pertanyaan</option></select></div><div class="field full"><label>Deskripsi singkat gangguan *</label><textarea name="description" maxlength="600" required placeholder="Tuliskan kode alarm, kondisi unit, dan dampaknya..." ></textarea></div><div class="field full"><label>Bukti foto (simulasi)</label><input type="file" name="evidence" accept="image/*"><div class="hint">File hanya dicatat namanya dalam demo; tidak diunggah ke server. Jika kosong, gunakan foto contoh dummy.</div></div><div class="full notice blue">Prioritas awal ditentukan dari tingkat dampak. Manajer dapat menyesuaikannya; SLA merujuk pada konfigurasi site demo.</div><div class="form-actions full"><button type="button" class="btn outline" data-action="close">Batal</button><button type="submit" class="btn">${ic('send')}Kirim & buat tiket</button></div></form>`,'UC-01 · PIC / Manajer')}
function ticketDetail(id){const t=ticket(id);if(!t)return;const a=asset(t.asset);const actions=role==='manager'&&t.status!=='Selesai'?`<button class="btn sm" data-action="assign" data-id="${t.id}">Atur Prioritas & Penugasan</button>`:role==='pic'&&t.status==='Menunggu Konfirmasi'?`<button class="btn sm" data-action="confirm" data-id="${t.id}">Konfirmasi & Beri Penilaian</button>`:role==='tech'&&t.assigned==='Arya Pratama'?`${t.status==='Ditugaskan'?`<button class="btn sm" data-action="start-ticket" data-id="${t.id}">Mulai Pekerjaan</button>`:''}${['Dikerjakan','Menunggu Pusat','Menunggu Suku Cadang'].includes(t.status)?`${t.status==='Dikerjakan'?`<button class="btn sm" data-action="report" data-id="${t.id}">Isi Laporan Servis</button>`:''}<button class="btn sm secondary" data-action="part-request" data-id="${t.id}">Permintaan Suku Cadang</button><button class="btn sm outline" data-action="escalate" data-id="${t.id}">Eskalasi HQ</button>`:''}`:'';const report=t.report?`<div class="report-section"><b>Ringkasan Laporan Servis</b><p><b>Akar penyebab:</b> ${esc(t.report.cause)}<br><b>Tindakan:</b> ${esc(t.report.action)}<br><b>Suku cadang:</b> ${esc(t.report.parts||'Tidak ada')}<br><b>Bukti:</b> ${esc(t.report.photo)}<br><b>Diserahkan:</b> ${fmtTime(t.report.submittedAt)}</p>${t.rating?`<p><b>Penilaian PIC:</b> ${esc(t.rating)}/5 · ${esc(t.feedback)}</p>${t.signature&&t.signature.startsWith('data:image/png;base64,')?`<div><span class="muted tiny">Paraf persetujuan (simulasi)</span><div><img alt="Paraf PIC demo" src="${t.signature}" style="width:200px;height:60px;object-fit:contain;border-bottom:1px solid var(--line)"></div></div>`:''}`:''}<button class="btn sm outline" data-action="download-report" data-id="${t.id}">${ic('download')}Unduh laporan TXT</button></div>`:'';modal(t.id+': '+t.title,`<div class="card-actions">${priority(t.priority)}${chip(t.status)}<span class="muted tiny">Dibuat ${fmtTime(t.created)}</span></div><div class="detail-grid"><div class="detail-box"><small>Aset / seri</small><strong>${esc(a.name)} · ${esc(a.serial)}</strong></div><div class="detail-box"><small>Lokasi site</small><strong>${esc(site(t.site).name)}</strong></div><div class="detail-box"><small>Ditangani oleh</small><strong>${esc(t.assigned||'Belum ditugaskan')}</strong></div><div class="detail-box"><small>Target kedatangan</small><strong>${fmtTime(t.eta)}</strong></div></div><div class="report-section"><b>Deskripsi laporan</b><p>${esc(t.description)}</p><p class="muted tiny">Dampak: ${esc(t.impact)} · Foto: ${esc(t.photo||'Belum ada')}</p></div>${report}<div class="section-head" style="margin:22px 0 10px"><h2 style="font-size:15px">Riwayat Penanganan</h2></div><ol class="timeline">${(t.events||[]).slice().reverse().map(e=>`<li><span class="time-dot"></span><div><b>${esc(e.text)}</b><p>${fmtTime(e.at)} · ${esc(e.by)}</p></div></li>`).join('')}</ol><div class="form-actions" style="margin-top:25px"><button class="btn outline" data-action="close">Tutup</button>${actions}</div>`,'Timeline dan atribut mengikuti use-case ESH',true)}
function showAssign(id){const t=ticket(id);if(!t)return;modal('Prioritisasi dan Penugasan Teknisi',`<form data-form="assign" class="form-grid"><input type="hidden" name="id" value="${t.id}"><div class="field full"><label>Tiket</label><input value="${esc(t.id+' — '+t.title)}" disabled></div><div class="field"><label>Prioritas penanganan *</label><select name="priority">${['P1','P2','P3','P4'].map(x=>`<option ${x===t.priority?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Teknisi *</label><select name="tech">${TECHS.map(x=>`<option ${x===t.assigned?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field full"><label>Target waktu kedatangan *</label><input type="datetime-local" name="eta" value="${todayInput()}T18:00" required><span class="hint">Target ini adalah input manajer; bukan estimasi dari sistem navigasi.</span></div><div class="full notice amber">Sistem mengizinkan prioritas diubah manajer berdasarkan dampak operasional. Rekomendasi otomatis teknisi hanya disimulasikan melalui daftar kompetensi pada prototipe.</div><div class="form-actions full"><button type="button" class="btn outline" data-action="close">Batal</button><button class="btn" type="submit">Simpan penugasan</button></div></form>`,'UC-05 · Manajer After Sales')}
function showReport(id){const t=ticket(id);if(!t)return;modal('Laporan Servis Digital',`<form data-form="report" class="form-grid"><input type="hidden" name="id" value="${t.id}"><div class="full notice blue">Tiket ${esc(t.id)} · ${esc(t.title)}. Laporan ini menghasilkan status <b>Menunggu Konfirmasi</b> dari PIC.</div><div class="field full"><label>Akar penyebab kerusakan *</label><textarea name="cause" required placeholder="Contoh: konektor sensor longgar"></textarea></div><div class="field full"><label>Tindakan perbaikan *</label><textarea name="action" required placeholder="Langkah yang telah dilakukan, pengujian, hasil akhir"></textarea></div><div class="field"><label>Suku cadang digunakan</label><input name="parts" placeholder="Tidak ada / sebutkan komponen"></div><div class="field"><label>Bukti foto servis *</label><input name="photoFile" type="file" accept="image/*"><div class="hint">Atau gunakan pilihan foto contoh di bawah.</div></div><div class="field full"><label>Foto contoh dummy</label><select name="demoPhoto"><option value="">Tidak menggunakan foto contoh</option><option value="Foto sebelum/sesudah – Demo">Foto sebelum/sesudah – Demo</option><option value="Foto tampilan HMI – Demo">Foto tampilan HMI – Demo</option></select></div><div class="full notice amber">Akar penyebab, tindakan, dan bukti foto wajib terisi. File foto hanya dicatat namanya pada penyimpanan lokal browser.</div><div class="form-actions full"><button type="button" class="btn outline" data-action="close">Batal</button><button type="submit" class="btn">Kirim laporan ke PIC</button></div></form>`,'UC-10 · After Sales Engineer')}

function initSignaturePad(){const canvas=document.getElementById('signatureCanvas');if(!canvas)return;const ctx=canvas.getContext('2d');ctx.lineWidth=3.5;ctx.strokeStyle='#244657';ctx.lineCap='round';ctx.lineJoin='round';canvas.dataset.signed='0';let active=false;const pos=e=>{const b=canvas.getBoundingClientRect();return [(e.clientX-b.left)*canvas.width/b.width,(e.clientY-b.top)*canvas.height/b.height]};canvas.addEventListener('pointerdown',e=>{active=true;canvas.setPointerCapture(e.pointerId);const [x,y]=pos(e);ctx.beginPath();ctx.moveTo(x,y)});canvas.addEventListener('pointermove',e=>{if(!active)return;const [x,y]=pos(e);ctx.lineTo(x,y);ctx.stroke();canvas.dataset.signed='1'});const end=()=>{active=false};canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end)}

function addEvent(t,txt,by){t.events=t.events||[];t.events.push({at:new Date().toISOString(),by,text:txt})}
function formHandler(form){const fd=new FormData(form),f=Object.fromEntries(fd.entries());const val=k=>String(f[k]||'').trim();const now=new Date().toISOString();let message='Perubahan tersimpan dalam data demo.';
  if(form.dataset.form==='new-ticket'){
   if(!['pic','manager'].includes(role))return;const siteid=role==='pic'?'SITE-01':val('site'),aid=val('asset');if(!aid){toast('Pilih aset terlebih dahulu.');return;}if(aid==='manual'&&!val('manualSerial')){toast('Isi nomor seri untuk unit yang belum terdaftar.');return;}let realid=aid;if(aid==='manual'){realid='AST-'+String(Date.now());data.assets.push({id:realid,site:siteid,name:'Unit belum terverifikasi',model:'Registrasi sementara',type:'CRAH',serial:val('manualSerial'),installed:now,warranty:future(365)});}if(role==='manager'&&asset(realid).site!==siteid){toast('Site dan aset tidak sesuai.');return;}const impact=val('impact'),p=impact.includes('Unit mati')?'P1':impact.includes('Performa')?'P2':impact.includes('Alarm')?'P3':'P4';const id='ESH-'+data.seq++;const t={id,site:siteid,asset:realid,title:val('description').slice(0,62),description:val('description'),category:val('category'),impact,priority:p,status:'Baru',created:now,assigned:'',eta:'',photo:f.evidence?.name||'Foto contoh HMI (dummy)',report:null,rating:null,feedback:'',events:[{at:now,by:ROLE_LABELS[role],text:'Tiket dibuat; prioritas awal '+p}]};data.tickets.unshift(t);message='Tiket '+id+' berhasil dibuat. Ganti role ke Manajer untuk menugaskan.';
  } else if(form.dataset.form==='assign'){
   if(role!=='manager')return;const t=ticket(val('id'));if(!t)return;if(new Date(val('eta')).getTime()<Date.now()-3600000){toast('Pilih target kedatangan yang masuk akal.');return;}t.priority=val('priority');t.assigned=val('tech');t.eta=new Date(val('eta')).toISOString();t.status='Ditugaskan';t.assignedAt=now;addEvent(t,'Prioritas '+t.priority+'; ditugaskan kepada '+t.assigned,'Manajer');message='Tiket '+t.id+' ditugaskan ke '+t.assigned+'.';
  } else if(form.dataset.form==='report'){
   if(role!=='tech')return;const t=ticket(val('id'));if(!t||t.assigned!=='Arya Pratama'||t.status!=='Dikerjakan')return;if(!val('cause')||!val('action')){toast('Akar penyebab dan tindakan wajib diisi.');return;}const photo=f.photoFile?.name||val('demoPhoto');if(!photo){toast('Sertakan file bukti atau pilih foto contoh dummy.');return;}t.report={cause:val('cause'),action:val('action'),parts:val('parts')||'Tidak ada',photo,submittedAt:now};t.status='Menunggu Konfirmasi';t.reportedAt=now;addEvent(t,'Laporan servis diserahkan; menunggu konfirmasi PIC','Arya Pratama');message='Laporan tersimpan. PIC bisa mengonfirmasi penyelesaian.';
  } else if(form.dataset.form==='confirm'){
   if(role!=='pic')return;const t=ticket(val('id'));if(!t||t.site!=='SITE-01'||t.status!=='Menunggu Konfirmasi')return;const canvas=document.getElementById('signatureCanvas');if(!canvas||canvas.dataset.signed!=='1'){toast('Gambarkan paraf persetujuan terlebih dahulu.');return;}t.signature=canvas.toDataURL('image/png');t.status='Selesai';t.rating=Number(val('rating'));t.feedback=val('feedback');t.signer=val('signer');t.closedAt=now;addEvent(t,'Penyelesaian dikonfirmasi oleh '+t.signer+'; rating '+t.rating+'/5','PIC Pelanggan');message='Tiket '+t.id+' selesai dan penilaian tersimpan.';
  } else if(form.dataset.form==='asset'){
   if(role!=='manager')return;const id='AST-'+String(data.assets.length+1).padStart(3,'0');data.assets.push({id,site:val('site'),name:val('name'),type:val('type'),model:val('model'),serial:val('serial'),installed:now,warranty:new Date(val('warranty')+'T12:00').toISOString()});message='Aset '+val('name')+' ditambahkan.';
  } else if(form.dataset.form==='site'){
   if(role!=='manager')return;const s=site(val('id'));s.responseSla=Number(val('response'));s.repairSla=Number(val('repair'));s.pmInterval=Number(val('interval'));message='Parameter SLA '+s.name+' diperbarui.';
  } else if(form.dataset.form==='pm'){
   if(role!=='manager')return;const a=asset(val('asset'));data.pms.push({id:'PM-'+String(data.pms.length+1).padStart(3,'0'),site:a.site,asset:a.id,tech:val('tech'),due:new Date(val('due')+'T09:00').toISOString(),status:'Dijadwalkan',checks:null});message='Jadwal PM baru dibuat.';
  } else if(form.dataset.form==='record-pm'){
   if(role!=='tech')return;const p=data.pms.find(x=>x.id===val('id'));if(!p||p.tech!=='Arya Pratama')return;p.checks={voltage:Number(val('voltage')),filter:Number(val('filter')),fan:val('fan'),note:val('note')};p.status='Selesai';p.completed=now;message=p.checks.filter>=75?'Checklist tersimpan. Kondisi filter ≥75%: pertimbangkan permintaan suku cadang.':'Checklist PM berhasil disimpan.';
  } else if(form.dataset.form==='kb'){
   if(role!=='manager')return;const id='KB-'+String(data.kb.length+1).padStart(3,'0');data.kb.push({id,type:val('type'),code:val('code'),status:'Draft',title:{id:val('title')},body:{id:val('body')}});message='Artikel draft dibuat. Klik Setujui & Terbitkan untuk mempublikasikan.';
  } else if(form.dataset.form==='part'){
   if(role!=='tech')return;const t=ticket(val('ticket'));if(!t||t.assigned!=='Arya Pratama')return;data.parts.push({id:'SP-'+String(data.parts.length+1).padStart(3,'0'),ticket:t.id,asset:t.asset,name:val('name'),qty:Number(val('qty')),status:'Diajukan',eta:'',requested:now});t.status='Menunggu Suku Cadang';addEvent(t,'Permintaan '+val('name')+' ('+val('qty')+') diajukan','Arya Pratama');message='Permintaan suku cadang dibuat dan tiket diperbarui.';
  } else if(form.dataset.form==='update-part'){
   if(role!=='manager')return;const p=data.parts.find(x=>x.id===val('id'));p.status=val('status');p.eta=val('eta')?new Date(val('eta')+'T12:00').toISOString():'';if(p.status==='Tiba'){const t=ticket(p.ticket);if(t?.status==='Menunggu Suku Cadang'){t.status='Dikerjakan';addEvent(t,'Suku cadang tiba; penanganan dilanjutkan','Manajer');}}message='Status komponen '+p.id+' diperbarui.';
  } else if(form.dataset.form==='escalation'){
   if(role!=='tech')return;const t=ticket(val('ticket'));if(!t||t.assigned!=='Arya Pratama')return;data.escalations.push({id:'ESC-'+String(data.escalations.length+1).padStart(3,'0'),ticket:t.id,question:val('question'),state:'Menunggu jawaban',response:'',created:now});t.status='Menunggu Pusat';addEvent(t,'Kasus dieskalasi ke Tim Teknis HQ','Arya Pratama');message='Eskalasi dikirim (simulasi).';
  } else if(form.dataset.form==='hq-reply'){
   if(role!=='hq')return;const e=data.escalations.find(x=>x.id===val('id'));if(!e)return;e.response=val('response');e.state='Dijawab';e.answered=now;const t=ticket(e.ticket);if(t&&t.status==='Menunggu Pusat'){t.status='Dikerjakan';addEvent(t,'Tim HQ memberikan rekomendasi teknis','Tim Teknis HQ');}message='Jawaban HQ tersimpan dan tiket dapat dilanjutkan.';
  } else return;
  save();closeModal();render();toast(message);
}
function downloadReport(id){const t=ticket(id);if(!t?.report)return;const a=asset(t.asset);const lines=['ENVICOOL SERVICE HUB - LAPORAN SERVIS (DEMO)','ID: '+t.id,'Judul: '+t.title,'Aset: '+a.name+' / '+a.serial,'Site: '+site(t.site).name,'Teknisi: '+t.assigned,'Tanggal: '+fmtTime(t.report.submittedAt),'Akar penyebab: '+t.report.cause,'Tindakan: '+t.report.action,'Suku cadang: '+t.report.parts,'Foto: '+t.report.photo,'Status: '+t.status,'Konfirmasi: '+(t.signer||'Belum ada'),'Rating: '+(t.rating||'Belum ada')+'/5','Catatan: '+(t.feedback||'-'),'--- DEMO: BUKAN DOKUMEN OPERASIONAL RESMI ---'];const blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'}),aEl=document.createElement('a'),url=URL.createObjectURL(blob);aEl.href=url;aEl.download=t.id+'-laporan-servis-demo.txt';aEl.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
// Event delegation for static GitHub Pages.
document.addEventListener('change',e=>{if(e.target.id==='roleSelect'){role=e.target.value;page='overview';closeModal();render();toast('Mode '+ROLE_LABELS[role]+' aktif (simulasi peran).')}else if(e.target.id==='warrantySelect'){ui.warrantyDays=e.target.value;render()}});
document.addEventListener('submit',e=>{const form=e.target.closest('form[data-form]');if(!form)return;e.preventDefault();formHandler(form)});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const act=b.dataset.action,id=b.dataset.id;if(act==='backdrop'&&e.target!==b)return;const go=p=>{page=p;closeModal();render();window.scrollTo(0,0)};switch(act){case 'nav':go(b.dataset.page);document.getElementById('sidebar')?.classList.remove('open');document.getElementById('overlay')?.classList.remove('show');break;case 'menu':document.getElementById('sidebar')?.classList.add('open');document.getElementById('overlay')?.classList.add('show');break;case 'menuclose':document.getElementById('sidebar')?.classList.remove('open');document.getElementById('overlay')?.classList.remove('show');break;case 'close':case 'backdrop':closeModal();break;case 'clear-signature':{const c=document.getElementById('signatureCanvas');if(c){c.getContext('2d').clearRect(0,0,c.width,c.height);c.dataset.signed='0';}break;}case 'help':showHelp();break;case 'reset':if(confirm('Reset seluruh data demo pada browser ini?')){data=demo();save();render();toast('Data demo direset.')}break;case 'go-work':go('work');break;case 'go-tickets':go('tickets');break;case 'go-hq':go('hq');break;case 'go-warranty':go('warranty');break;case 'new-ticket':case 'new-ticket-internal':if(['pic','manager'].includes(role))showTicketForm();break;case 'ticket':{const t=ticket(id);if(role==='pic'&&t?.site!=='SITE-01')return;if(role==='tech'&&t?.assigned!=='Arya Pratama')return;ticketDetail(id);break;}case 'assign':if(role==='manager')showAssign(id);break;case 'start-ticket':{const t=ticket(id);if(role==='tech'&&t?.assigned==='Arya Pratama'&&t.status==='Ditugaskan'){t.status='Dikerjakan';t.startedAt=new Date().toISOString();addEvent(t,'Teknisi mulai menangani gangguan','Arya Pratama');save();closeModal();render();toast('Pekerjaan dimulai. Silakan isi laporan setelah selesai.');}break;}case 'report':if(role==='tech')showReport(id);break;case 'confirm':if(role==='pic')showConfirm(id);break;case 'asset':{const a=asset(id);if(role==='pic'&&a.site!=='SITE-01')return;assetDetail(id);break;}case 'new-asset':if(role==='manager')showNewAsset();break;case 'edit-site':if(role==='manager')showEditSite(id);break;case 'new-pm':if(role==='manager')showNewPM();break;case 'record-pm':if(role==='tech')showRecordPM(id);break;case 'view-pm':viewPM(id);break;case 'new-kb':if(role==='manager')showNewKB();break;case 'approve-kb':if(role==='manager'){const k=data.kb.find(x=>x.id===id);if(k){k.status='Terbit';save();render();toast('Artikel disetujui dan terbit.')}}break;case 'lang':ui.lang=b.dataset.lang;render();break;case 'filter-kb':ui.kbSearch=document.getElementById('kbSearch')?.value||'';ui.kbType=document.getElementById('kbType')?.value||'Semua';render();break;case 'filter-tickets':ui.ticketSearch=document.getElementById('ticketSearch')?.value||'';ui.ticketStatus=document.getElementById('ticketStatus')?.value||'';render();break;case 'clear-filter':ui.ticketSearch='';ui.ticketStatus='';render();break;case 'new-part':case 'part-request':if(role==='tech')showPartForm(id);break;case 'update-part':if(role==='manager')showUpdatePart(id);break;case 'new-escalation':case 'escalate':if(role==='tech')showEscalationForm(id);break;case 'reply-hq':if(role==='hq')showHQReply(id);break;case 'followup':if(role==='sales'){if(!data.followups.some(f=>f.asset===id)){data.followups.push({asset:id,at:new Date().toISOString()});save();render();toast('Follow-up garansi ditandai selesai (demo).')}}break;case 'download-report':downloadReport(id);break;case 'qr-demo':{const s=document.getElementById('newTicketAsset');if(s){const opts=Array.from(s.options).filter(o=>o.value&&o.value!=='manual');if(opts[0]){s.value=opts[0].value;toast('Simulasi QR: '+opts[0].text+' dipilih.');}}break;}}});
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
render();
