/*
  ENVICOOL SERVICE HUB — Corporate UI system
  Core brand: Envicool deep blue / safety orange.
  Editorial hierarchy, concise surfaces, accessible contrast.
*/
:root{
  --navy:#00388b;
  --navy2:#062d72;
  --mint:#0646a2;
  --mint-soft:#ecf3ff;
  --paper:#f5f7fb;
  --card:#ffffff;
  --ink:#172c49;
  --muted:#697a91;
  --line:#e3e9f2;
  --shadow:0 1px 2px rgba(13,36,72,.035);
  --radius:10px;
  --red:#c83c52;
  --red-bg:#fff0f2;
  --amber:#a86a11;
  --amber-bg:#fff6e9;
  --blue:#0646a2;
  --blue-bg:#edf4ff;
  --brand:#063b95;
  --brand-deep:#092c6c;
  --brand-hover:#0c4eac;
  --orange:#ef9514;
  --focus:rgba(19,87,175,.16);
}
html{scroll-behavior:smooth}
html,body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--paper);color:var(--ink);font-size:13px;letter-spacing:-.006em}
button,input,select,textarea{font-family:inherit}
button{transition:background-color .16s ease,border-color .16s ease,color .16s ease,box-shadow .16s ease}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
button:disabled{opacity:.45}
::selection{background:#dce9ff;color:#032d70}
.app{min-height:100vh;background:var(--paper)}
.sidebar{width:250px;background:#fff;color:#51637c;padding:0;border-right:1px solid #dfe6ef;box-shadow:0 0 1px #ddd;z-index:30}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:11px;margin:0;padding:24px 22px 19px;border-bottom:1px solid var(--line);min-height:128px;color:var(--ink)}
.brand-logo-wrap{display:flex;width:164px;height:59px;align-items:center;justify-content:flex-start;overflow:hidden;position:relative;background:#fff}
.brand-logo{display:block;width:160px;max-height:62px;object-fit:contain;object-position:left center;mix-blend-mode:multiply}.brand-logo-official{position:absolute;inset:0;opacity:0;transition:opacity .22s ease;background:white}.brand-logo-official.loaded{opacity:1}
.brand-subline{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:760;letter-spacing:.12em;color:#6d809a}
.brand-subline:before{content:"";width:3px;height:13px;border-radius:1px;background:var(--orange)}
.workspace-label{display:flex;justify-content:space-between;align-items:center;margin:23px 21px 12px;color:#8998ac;font-size:10px;letter-spacing:.13em;font-weight:760;text-transform:uppercase}
.workspace-label span:last-child{color:#a8b4c3;font-weight:600;letter-spacing:0}
.nav-label{padding:0;margin:0}
.nav{padding:0 11px;gap:4px;scrollbar-width:thin;scrollbar-color:#d9e2ef transparent}
.nav button{border-radius:7px;min-height:42px;padding:11px 12px;gap:11px;color:#51637d;font-weight:615;line-height:1.25;font-size:12px}
.nav button:hover{background:#f3f6fb;color:#11356c}
.nav button.active{background:#eaf1fe;color:#073b92;box-shadow:none;font-weight:745}
.nav button.active:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#0748a5;border-radius:2px}
.nav button{position:relative}
.nav button.active svg{stroke-width:2.1}
.nav svg{width:17px;height:17px}
.sidebar-bottom{padding:16px 18px 22px;margin:20px 10px 0;border-top:1px solid var(--line);color:#7d8ca0;line-height:1.55;font-size:10.5px}
.sidebar-bottom .mini{color:#2c4769;font-size:11px;display:flex;align-items:center;gap:7px;margin-bottom:7px}
.sidebar-bottom .mini:before{content:"";background:#1e9b74;width:6px;height:6px;border-radius:50%}

function initSignaturePad(){const canvas=document.getElementById('signatureCanvas');if(!canvas)return;const ctx=canvas.getContext('2d');ctx.lineWidth=3.5;ctx.strokeStyle='#244657';ctx.lineCap='round';ctx.lineJoin='round';canvas.dataset.signed='0';let active=false;const pos=e=>{const b=canvas.getBoundingClientRect();return [(e.clientX-b.left)*canvas.width/b.width,(e.clientY-b.top)*canvas.height/b.height]};canvas.addEventListener('pointerdown',e=>{active=true;canvas.setPointerCapture(e.pointerId);const [x,y]=pos(e);ctx.beginPath();ctx.moveTo(x,y)});canvas.addEventListener('pointermove',e=>{if(!active)return;const [x,y]=pos(e);ctx.lineTo(x,y);ctx.stroke();canvas.dataset.signed='1'});const end=()=>{active=false};canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end)}

function formHandler(form){const fd=new FormData(form),f=Object.fromEntries(fd.entries());const val=k=>String(f[k]||'').trim();const now=new Date().toISOString();let message='Perubahan tersimpan dalam data demo.';
  if(form.dataset.form==='new-ticket'){
   if(!['pic','manager'].includes(role))return;const siteid=role==='pic'?'SITE-01':val('site'),aid=val('asset');if(!aid){toast('Pilih aset terlebih dahulu.');return;}if(aid==='manual'&&!val('manualSerial')){toast('Isi nomor seri untuk unit yang belum terdaftar.');return;}let realid=aid;if(aid==='manual'){realid='AST-'+String(Date.now());data.assets.push({id:realid,site:siteid,name:'Unit belum terverifikasi',model:'Registrasi sementara',type:'CRAH',serial:val('manualSerial'),installed:now,warranty:future(365)});}if(role==='manager'&&asset(realid).site!==siteid){toast('Site dan aset tidak sesuai.');return;}const impact=val('impact'),p=impact.includes('Unit mati')?'P1':impact.includes('Performa')?'P2':impact.includes('Alarm')?'P3':'P4';const id='ESH-'+data.seq++;const t={id,site:siteid,asset:realid,title:val('description').slice(0,62),description:val('description'),category:val('category'),impact,priority:p,status:'Baru',created:now,assigned:'',eta:'',photo:f.evidence?.name||'Foto contoh HMI (dummy)',report:null,rating:null,feedback:'',events:[{at:now,by:ROLE_LABELS[role],text:'Tiket dibuat; prioritas awal '+p}]};data.tickets.unshift(t);message='Tiket '+id+' berhasil dibuat. Ganti role ke Manajer untuk menugaskan.';
  } else if(form.dataset.form==='assign'){
   if(role!=='manager')return;const t=ticket(val('id'));if(!t)return;if(new Date(val('eta')).getTime()<Date.now()-3600000){toast('Pilih target kedatangan yang masuk akal.');return;}t.priority=val('priority');t.assigned=val('tech');t.eta=new Date(val('eta')).toISOString();t.status='Ditugaskan';t.assignedAt=now;addEvent(t,'Prioritas '+t.priority+'; ditugaskan kepada '+t.assigned,'Manajer');message='Tiket '+t.id+' ditugaskan ke '+t.assigned+'.';
  } else if(form.dataset.form==='report'){
   if(role!=='tech')return;const t=ticket(val('id'));if(!t||t.assigned!=='Arya Pratama'||t.status!=='Dikerjakan')return;if(!val('cause')||!val('action')){toast('Akar penyebab dan tindakan wajib diisi.');return;}const photo=f.photoFile?.name||val('demoPhoto');if(!photo){toast('Sertakan file bukti atau pilih foto contoh dummy.');return;}t.report={cause:val('cause'),action:val('action'),parts:val('parts')||'Tidak ada',photo,submittedAt:now};t.status='Menunggu Konfirmasi';t.reportedAt=now;addEvent(t,'Laporan servis diserahkan; menunggu konfirmasi PIC','Arya Pratama');message='Laporan tersimpan. PIC bisa mengonfirmasi penyelesaian.';
  } else if(form.dataset.form==='confirm'){
   if(role!=='pic')return;const t=ticket(val('id'));if(!t||t.site!=='SITE-01'||t.status!=='Menunggu Konfirmasi')return;const canvas=document.getElementById('signatureCanvas');if(!canvas||canvas.dataset.signed!=='1'){toast('Gambarkan paraf persetujuan terlebih dahulu.');return;}t.signature=canvas.toDataURL('image/png');t.status='Selesai';t.rating=Number(val('rating'));t.feedback=val('feedback');t.signer=val('signer');t.closedAt=now;addEvent(t,'Penyelesaian dikonfirmasi oleh '+t.signer+'; rating '+t.rating+'/5','PIC Pelanggan');message='Tiket '+t.id+' selesai dan penilaian tersimpan.';
  } else if(form.dataset.form==='asset'){
   if(role!=='manager')return;const id='AST-'+String(data.assets.length+1).padStart(3,'0');data.assets.push({id,site:val('site'),name:val('name'),type:val('type'),model:val('model'),serial:val('serial'),installed:now,warranty:new Date(val('warranty')+'T12:00').toISOString()});message='Aset '+val('name')+' ditambahkan.';
  } else if(form.dataset.form==='site'){
   if(role!=='manager')return;const s=site(val('id'));s.responseSla=Number(val('response'));s.repairSla=Number(val('repair'));s.pmInterval=Number(val('interval'));message='Parameter SLA '+s.name+' diperbarui.';
  } else if(form.dataset.form==='pm'){
   if(role!=='manager')return;const a=asset(val('asset'));data.pms.push({id:'PM-'+String(data.pms.length+1).padStart(3,'0'),site:a.site,asset:a.id,tech:val('tech'),due:new Date(val('due')+'T09:00').toISOString(),status:'Dijadwalkan',checks:null});message='Jadwal PM baru dibuat.';
  } else if(form.dataset.form==='record-pm'){
   if(role!=='tech')return;const p=data.pms.find(x=>x.id===val('id'));if(!p||p.tech!=='Arya Pratama')return;p.checks={voltage:Number(val('voltage')),filter:Number(val('filter')),fan:val('fan'),note:val('note')};p.status='Selesai';p.completed=now;message=p.checks.filter>=75?'Checklist tersimpan. Kondisi filter ≥75%: pertimbangkan permintaan suku cadang.':'Checklist PM berhasil disimpan.';
  } else if(form.dataset.form==='kb'){
   if(role!=='manager')return;const id='KB-'+String(data.kb.length+1).padStart(3,'0');data.kb.push({id,type:val('type'),code:val('code'),status:'Draft',title:{id:val('title')},body:{id:val('body')}});message='Artikel draft dibuat. Klik Setujui & Terbitkan untuk mempublikasikan.';
  } else if(form.dataset.form==='part'){
   if(role!=='tech')return;const t=ticket(val('ticket'));if(!t||t.assigned!=='Arya Pratama')return;data.parts.push({id:'SP-'+String(data.parts.length+1).padStart(3,'0'),ticket:t.id,asset:t.asset,name:val('name'),qty:Number(val('qty')),status:'Diajukan',eta:'',requested:now});t.status='Menunggu Suku Cadang';addEvent(t,'Permintaan '+val('name')+' ('+val('qty')+') diajukan','Arya Pratama');message='Permintaan suku cadang dibuat dan tiket diperbarui.';
  } else if(form.dataset.form==='update-part'){
   if(role!=='manager')return;const p=data.parts.find(x=>x.id===val('id'));p.status=val('status');p.eta=val('eta')?new Date(val('eta')+'T12:00').toISOString():'';if(p.status==='Tiba'){const t=ticket(p.ticket);if(t?.status==='Menunggu Suku Cadang'){t.status='Dikerjakan';addEvent(t,'Suku cadang tiba; penanganan dilanjutkan','Manajer');}}message='Status komponen '+p.id+' diperbarui.';
  } else if(form.dataset.form==='escalation'){
   if(role!=='tech')return;const t=ticket(val('ticket'));if(!t||t.assigned!=='Arya Pratama')return;data.escalations.push({id:'ESC-'+String(data.escalations.length+1).padStart(3,'0'),ticket:t.id,question:val('question'),state:'Menunggu jawaban',response:'',created:now});t.status='Menunggu Pusat';addEvent(t,'Kasus dieskalasi ke Tim Teknis HQ','Arya Pratama');message='Eskalasi dikirim (simulasi).';
  } else if(form.dataset.form==='hq-reply'){
   if(role!=='hq')return;const e=data.escalations.find(x=>x.id===val('id'));if(!e)return;e.response=val('response');e.state='Dijawab';e.answered=now;const t=ticket(e.ticket);if(t&&t.status==='Menunggu Pusat'){t.status='Dikerjakan';addEvent(t,'Tim HQ memberikan rekomendasi teknis','Tim Teknis HQ');}message='Jawaban HQ tersimpan dan tiket dapat dilanjutkan.';
  } else return;
  save();closeModal();render();toast(message);
}
function downloadReport(id){const t=ticket(id);if(!t?.report)return;const a=asset(t.asset);const lines=['ENVICOOL SERVICE HUB - LAPORAN SERVIS (DEMO)','ID: '+t.id,'Judul: '+t.title,'Aset: '+a.name+' / '+a.serial,'Site: '+site(t.site).name,'Teknisi: '+t.assigned,'Tanggal: '+fmtTime(t.report.submittedAt),'Akar penyebab: '+t.report.cause,'Tindakan: '+t.report.action,'Suku cadang: '+t.report.parts,'Foto: '+t.report.photo,'Status: '+t.status,'Konfirmasi: '+(t.signer||'Belum ada'),'Rating: '+(t.rating||'Belum ada')+'/5','Catatan: '+(t.feedback||'-'),'--- DEMO: BUKAN DOKUMEN OPERASIONAL RESMI ---'];const blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'}),aEl=document.createElement('a'),url=URL.createObjectURL(blob);aEl.href=url;aEl.download=t.id+'-laporan-servis-demo.txt';aEl.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
// Event delegation for static GitHub Pages.
document.addEventListener('change',e=>{if(e.target.id==='roleSelect'){role=e.target.value;page='overview';closeModal();render();toast('Mode '+ROLE_LABELS[role]+' aktif (simulasi peran).')}else if(e.target.id==='warrantySelect'){ui.warrantyDays=e.target.value;render()}});
document.addEventListener('submit',e=>{const form=e.target.closest('form[data-form]');if(!form)return;e.preventDefault();formHandler(form)});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const act=b.dataset.action,id=b.dataset.id;if(act==='backdrop'&&e.target!==b)return;const go=p=>{page=p;closeModal();render();window.scrollTo(0,0)};switch(act){case 'nav':go(b.dataset.page);document.getElementById('sidebar')?.classList.remove('open');document.getElementById('overlay')?.classList.remove('show');break;case 'menu':document.getElementById('sidebar')?.classList.add('open');document.getElementById('overlay')?.classList.add('show');break;case 'menuclose':document.getElementById('sidebar')?.classList.remove('open');document.getElementById('overlay')?.classList.remove('show');break;case 'close':case 'backdrop':closeModal();break;case 'clear-signature':{const c=document.getElementById('signatureCanvas');if(c){c.getContext('2d').clearRect(0,0,c.width,c.height);c.dataset.signed='0';}break;}case 'help':showHelp();break;case 'reset':if(confirm('Reset seluruh data demo pada browser ini?')){data=demo();save();render();toast('Data demo direset.')}break;case 'go-work':go('work');break;case 'go-tickets':go('tickets');break;case 'go-hq':go('hq');break;case 'go-warranty':go('warranty');break;case 'new-ticket':case 'new-ticket-internal':if(['pic','manager'].includes(role))showTicketForm();break;case 'ticket':{const t=ticket(id);if(role==='pic'&&t?.site!=='SITE-01')return;if(role==='tech'&&t?.assigned!=='Arya Pratama')return;ticketDetail(id);break;}case 'assign':if(role==='manager')showAssign(id);break;case 'start-ticket':{const t=ticket(id);if(role==='tech'&&t?.assigned==='Arya Pratama'&&t.status==='Ditugaskan'){t.status='Dikerjakan';t.startedAt=new Date().toISOString();addEvent(t,'Teknisi mulai menangani gangguan','Arya Pratama');save();closeModal();render();toast('Pekerjaan dimulai. Silakan isi laporan setelah selesai.');}break;}case 'report':if(role==='tech')showReport(id);break;case 'confirm':if(role==='pic')showConfirm(id);break;case 'asset':{const a=asset(id);if(role==='pic'&&a.site!=='SITE-01')return;assetDetail(id);break;}case 'new-asset':if(role==='manager')showNewAsset();break;case 'edit-site':if(role==='manager')showEditSite(id);break;case 'new-pm':if(role==='manager')showNewPM();break;case 'record-pm':if(role==='tech')showRecordPM(id);break;case 'view-pm':viewPM(id);break;case 'new-kb':if(role==='manager')showNewKB();break;case 'approve-kb':if(role==='manager'){const k=data.kb.find(x=>x.id===id);if(k){k.status='Terbit';save();render();toast('Artikel disetujui dan terbit.')}}break;case 'lang':ui.lang=b.dataset.lang;render();break;case 'filter-kb':ui.kbSearch=document.getElementById('kbSearch')?.value||'';ui.kbType=document.getElementById('kbType')?.value||'Semua';render();break;case 'filter-tickets':ui.ticketSearch=document.getElementById('ticketSearch')?.value||'';ui.ticketStatus=document.getElementById('ticketStatus')?.value||'';render();break;case 'clear-filter':ui.ticketSearch='';ui.ticketStatus='';render();break;case 'new-part':case 'part-request':if(role==='tech')showPartForm(id);break;case 'update-part':if(role==='manager')showUpdatePart(id);break;case 'new-escalation':case 'escalate':if(role==='tech')showEscalationForm(id);break;case 'reply-hq':if(role==='hq')showHQReply(id);break;case 'followup':if(role==='sales'){if(!data.followups.some(f=>f.asset===id)){data.followups.push({asset:id,at:new Date().toISOString()});save();render();toast('Follow-up garansi ditandai selesai (demo).')}}break;case 'download-report':downloadReport(id);break;case 'qr-demo':{const s=document.getElementById('newTicketAsset');if(s){const opts=Array.from(s.options).filter(o=>o.value&&o.value!=='manual');if(opts[0]){s.value=opts[0].value;toast('Simulasi QR: '+opts[0].text+' dipilih.');}}break;}}});
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
render();
